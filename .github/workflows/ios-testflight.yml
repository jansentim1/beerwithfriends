# Archive, sign in the cloud, and upload to TestFlight from a GitHub-hosted Mac.
# Manual trigger only. Required repository secrets:
#   ASC_KEY_ID        App Store Connect API key id (10 chars)
#   ASC_ISSUER_ID     App Store Connect issuer id (UUID)
#   ASC_KEY_P8        Contents of the AuthKey_XXXX.p8 file (paste the whole file)
#   APPLE_TEAM_ID     10-character team id from developer.apple.com/account
#   FIREBASE_PLIST_B64  `base64 -w0 GoogleService-Info.plist`
# The API key needs the App Manager (or Admin) role so xcodebuild can create
# the distribution certificate and profile itself (-allowProvisioningUpdates).
name: ios-testflight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "missing secret $v"; exit 1; }
          done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "missing secret ASC_KEY_P8"; exit 1; }
          [ -n "${{ secrets.FIREBASE_PLIST_B64 }}" ] || { echo "missing secret FIREBASE_PLIST_B64"; exit 1; }

      - name: Materialize secrets
        run: |
          mkdir -p ~/private_keys App/Resources
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "${{ secrets.FIREBASE_PLIST_B64 }}" | base64 -d > App/Resources/GoogleService-Info.plist
          plutil -lint App/Resources/GoogleService-Info.plist

      - name: Toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'BeerKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Archive (cloud-managed signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BeerWithFriends.xcodeproj \
            -scheme BeerWithFriends \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BeerWithFriends.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log | grep -E 'error:|warning: unre|ARCHIVE|Signing|Provisioning' || true
          grep -E ' error: ' archive.log | sort -u || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' archive.log

      - name: Export and upload to TestFlight
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/BeerWithFriends.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -vE '^\s*$' | tail -40
          grep -q 'EXPORT SUCCEEDED' export.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs
          path: |
            archive.log
            export.log

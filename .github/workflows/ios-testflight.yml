# Archive, sign in the cloud, and upload to TestFlight from a GitHub-hosted Mac.
# Manual trigger only. Required repository secrets:
#   ASC_KEY_ID        App Store Connect API key id (10 chars)
#   ASC_ISSUER_ID     App Store Connect issuer id (UUID)
#   ASC_KEY_P8        Contents of the AuthKey_XXXX.p8 file (paste the whole file)
#   APPLE_TEAM_ID     10-character team id from developer.apple.com/account
#   FIREBASE_PLIST_B64  `base64 -w0 GoogleService-Info.plist`
#   DIST_P12_B64        Apple Distribution certificate + key as base64 .p12
#   DIST_P12_PASSWORD   password of that .p12
#   DIST_PROFILE_B64    App Store provisioning profile (.mobileprovision) as base64
# Signing is MANUAL with the certificate/profile above (created via the App Store
# Connect API from tim-server; automatic signing needs a registered device, which
# a Mac-less team never has). The API key is still used for the upload.
name: ios-testflight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "missing secret $v"; exit 1; }
          done
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "missing secret ASC_KEY_P8"; exit 1; }
          [ -n "${{ secrets.FIREBASE_PLIST_B64 }}" ] || { echo "missing secret FIREBASE_PLIST_B64"; exit 1; }
          [ -n "${{ secrets.DIST_P12_B64 }}" ] || { echo "missing secret DIST_P12_B64"; exit 1; }
          [ -n "${{ secrets.DIST_PROFILE_B64 }}" ] || { echo "missing secret DIST_PROFILE_B64"; exit 1; }

      - name: Materialize secrets
        run: |
          mkdir -p ~/private_keys App/Resources
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "${{ secrets.FIREBASE_PLIST_B64 }}" | base64 -d > App/Resources/GoogleService-Info.plist
          plutil -lint App/Resources/GoogleService-Info.plist

      - name: Install signing certificate and profile
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "${{ secrets.DIST_P12_B64 }}" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "${{ secrets.DIST_P12_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          echo "${{ secrets.DIST_PROFILE_B64 }}" | base64 -d > "$RUNNER_TEMP/dist.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/dist.mobileprovision" | plutil -extract Name raw -)
          cp "$RUNNER_TEMP/dist.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          cp "$RUNNER_TEMP/dist.mobileprovision" ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "installed profile '$NAME' ($UUID)"

      - name: Toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'BeerKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Archive (manual distribution signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BeerWithFriends.xcodeproj \
            -scheme BeerWithFriends \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BeerWithFriends.xcarchive \
            -skipPackagePluginValidation -skipMacroValidation \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee archive.log | grep -E 'error:|warning: unre|ARCHIVE|Signing|Provisioning' || true
          grep -E ' error: ' archive.log | sort -u || true
          grep -q '\*\* ARCHIVE SUCCEEDED \*\*' archive.log

      - name: Export and upload to TestFlight
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>com.timjansen.BeerWithFriends</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/BeerWithFriends.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee export.log | grep -vE '^\s*$' | tail -40
          grep -q 'EXPORT SUCCEEDED' export.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs
          path: |
            archive.log
            export.log

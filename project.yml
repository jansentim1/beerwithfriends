name: BeerWithFriends
options: { bundleIdPrefix: com.timjansen, deploymentTarget: { iOS: "17.0" } }
packages:
  BeerKit: { path: BeerKit }
  Firebase: { url: https://github.com/firebase/firebase-ios-sdk, from: 11.0.0 }
targets:
  BeerWithFriends:
    type: application
    platform: iOS
    sources:
      - App/Sources
      # GoogleService-Info.plist lives here (gitignored; CI writes it from a secret).
      - { path: App/Resources, optional: true, excludes: ["README.md"] }
    dependencies:
      - package: BeerKit
      - package: Firebase
        products: [FirebaseAuth, FirebaseFirestore, FirebaseStorage, FirebaseMessaging, FirebaseFunctions]
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        INFOPLIST_KEY_CFBundleDisplayName: "PubDates"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Manual distribution signing, scoped to this target only (command-line
        # overrides would also hit the Firebase SwiftPM targets, which reject profiles).
        # The simulator compile passes CODE_SIGNING_ALLOWED=NO so these are inert there.
        DEVELOPMENT_TEAM: G4S9QDYP4H
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        # Must match the Name inside the DIST_PROFILE_B64 profile (created before the rename to PubDates).
        PROVISIONING_PROFILE_SPECIFIER: "Pints With Mates App Store"
        # Simulator: ad-hoc sign so keychain (Firebase Auth) works in UI tests.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Automatic
        "PROVISIONING_PROFILE_SPECIFIER[sdk=iphonesimulator*]": ""
    entitlements:
      path: App/BeerWithFriends.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: production
    scheme:
      testTargets: [PubDatesUITests]
    info:
      path: App/Info.plist
      properties:
        NSCameraUsageDescription: "Take a live photo of your beer to share with friends."
        # Name shown in system dialogs ("PubDates would like to access the camera").
        CFBundleName: PubDates
        # Without a launch screen iOS letterboxes the app in a compatibility window.
        UILaunchScreen: {}
        # XcodeGen writes literal "1"/"1.0" otherwise; CI sets CURRENT_PROJECT_VERSION per run.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        UIBackgroundModes: [remote-notification]
        # pubdates://add/<username> — the QR / invite mate link.
        CFBundleURLTypes:
          - CFBundleURLName: com.timjansen.BeerWithFriends
            CFBundleURLSchemes: [pubdates]
        ITSAppUsesNonExemptEncryption: false
  PubDatesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: BeerWithFriends
    settings:
      base:
        TEST_TARGET_NAME: BeerWithFriends
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""

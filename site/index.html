<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PubDates</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #F2F2F7; color: #111; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } .card { background: #1C1C1E; } }
  .card { background: #fff; border-radius: 20px; padding: 28px 24px; max-width: 360px; margin: 24px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: #6E6E73; margin: 0 0 20px; line-height: 1.4; }
  .btn { display: block; background: #E68A00; color: #291700; font-weight: 700; text-decoration: none; padding: 16px; border-radius: 20px; margin-top: 12px; }
  .btn.quiet { background: transparent; color: #A35A00; }
  code { font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <h1>PubDates 🍺</h1>
  <p id="lead">Opening PubDates…</p>
  <a id="open" class="btn" href="#">Open in PubDates</a>
  <a class="btn quiet" href="https://testflight.apple.com/join/1QfbyRt9">Don't have it yet? Get it on TestFlight</a>
</div>
<script>
  var m = location.pathname.match(/\/add\/([a-z0-9_]{3,15})/i);
  var u = m ? m[1].toLowerCase() : null;
  var lead = document.getElementById('lead'), open = document.getElementById('open');
  if (u) {
    lead.innerHTML = 'Add <code>@' + u + '</code> as a mate. If PubDates is installed this opens it; otherwise install it first, then tap the link again.';
    open.href = 'pubdates://add/' + u;
    setTimeout(function () { location.href = 'pubdates://add/' + u; }, 400);
  } else {
    lead.textContent = 'Tap when you crack one open — your mates hear it and cheers you back.';
    open.style.display = 'none';
  }
</script>
</body>
</html>
